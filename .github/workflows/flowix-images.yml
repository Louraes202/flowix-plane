# Flowix: build the rebranded frontend images (web, admin, space) and push them to GHCR.
# The other Plane images (backend, live, proxy) stay the official makeplane ones.
name: Flowix images

on:
  push:
    branches: ["flowix/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: flowix-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Louraes202/flowix-plane'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            image: flowix-plane-frontend
            dockerfile: apps/web/Dockerfile.web
          - app: admin
            image: flowix-plane-admin
            dockerfile: apps/admin/Dockerfile.admin
          - app: space
            image: flowix-plane-space
            dockerfile: apps/space/Dockerfile.space
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          version="v$(jq -r .version apps/web/package.json)"
          short="$(git rev-parse --short=7 HEAD)"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          {
            echo "tags<<EOF"
            echo "${repo}:${version}-flowix-${short}"
            if [ "${GITHUB_REF_NAME}" = "flowix/branding" ] || [[ "${GITHUB_REF_NAME}" == flowix/v* ]]; then
              echo "${repo}:${version}-flowix"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Plane ${{ matrix.app }} with Flowix branding
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
